[mypy]

ignore_missing_imports = True


[mypy-tracklater.settings]
ignore_errors = True

[mypy-tracklater.user_settings]
ignore_errors = True

[mypy-tracklater.example_settings]
ignore_errors = True

[mypy-tracklater.test_settings]
ignore_errors = True

# The models annotate columns with their Python types (str, datetime) so the
# rest of the code sees those; SQLAlchemy 2's own stubs type Column(...) as
# Column[...] and db.Model as dynamic, which only matters inside this file.
[mypy-tracklater.models]
ignore_errors = True
